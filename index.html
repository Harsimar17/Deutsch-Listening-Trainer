<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>German Vocabulary Listening Trainer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5; color: #1f1f1f;
    display: flex; justify-content: center; min-height: 100vh;
  }
  .app { width: min(760px, 94vw); margin: 40px auto; }
  .card {
    background: white; border-radius: 20px; padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .sub { color: #666; margin-bottom: 25px; }
  .top { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:25px; }
  select, button, input[type=range] { font: inherit; }
  select {
    padding: 10px 12px; border:1px solid #ccc; border-radius:10px;
    background:white;
  }
  .word { font-size: 42px; font-weight: 750; margin-top: 10px; }
  .meaning { font-size: 20px; color:#666; margin: 5px 0 25px; }
  .example {
    font-size: 27px; line-height:1.45; padding:22px;
    background:#f7f7f7; border-radius:14px; margin-bottom:18px;
  }
  .controls { display:flex; gap:10px; flex-wrap:wrap; }
  button {
    border:0; border-radius:12px; padding:12px 18px; cursor:pointer;
    background:#222; color:white;
  }
  button.secondary { background:#e9e9e9; color:#222; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .settings {
    margin-top:22px; padding-top:18px; border-top:1px solid #eee;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .progress { margin-top:20px; color:#777; font-size:14px; }
  .status { min-height:22px; margin-top:12px; color:#777; }
  .hint { margin-top:20px; font-size:14px; color:#777; line-height:1.5; }
  label { font-size:14px; color:#555; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>🇩🇪 German Listening Trainer</h1>
    <div class="sub">Practice your vocabulary through complete German sentences.</div>

    <div class="top">
      <select id="level">
        <option value="ALL">All levels</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="B1">B1</option>
      </select>
      <button class="secondary" id="shuffle">🔀 Shuffle</button>
    </div>

    <div class="word" id="word">Loading…</div>
    <div class="meaning" id="meaning"></div>
    <div class="example" id="example"></div>

    <div class="controls">
      <button id="listen">🔊 Listen</button>
      <button class="secondary" id="repeat">🔁 Repeat</button>
      <button class="secondary" id="prev">← Previous</button>
      <button class="secondary" id="next">Next →</button>
    </div>

    <div class="settings">
      <label for="speed">Speech speed</label>
      <input id="speed" type="range" min="0.6" max="1.1" value="0.85" step="0.05">
      <span id="speedValue">0.85×</span>
      <button class="secondary" id="auto">▶ Auto-play: Off</button>
    </div>

    <div class="progress" id="progress"></div>
    <div class="status" id="status"></div>

    <div class="hint">
      Tip: For listening practice, first listen without looking at the English meaning.
      Then say the German sentence yourself before moving to the next word.
    </div>
  </div>
</div>

<script>
let allWords = [];
let words = [];
let index = 0;
let autoPlay = false;
let voices = [];

const $ = id => document.getElementById(id);

function loadVoices() {
  voices = speechSynthesis.getVoices();
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

async function loadVocabulary() {
  try {
    const response = await fetch("https://harsimar17.github.io/Deutsch-Vocab-Helper/german_vocab.json");
    if (!response.ok) throw new Error("Could not load german_vocab.json");
    const data = await response.json();

    // Supports the uploaded file's structure:
    // levels -> A1/A2/B1 -> nouns -> der/die/das
    // and other categories containing arrays of vocabulary objects.
    allWords = [];
    for (const [level, levelData] of Object.entries(data.levels || {})) {
      walk(levelData, level);
    }

    words = allWords;
    if (!words.length) throw new Error("No vocabulary entries found.");
    update();
  } catch (err) {
    $("word").textContent = "Could not load vocabulary";
    $("meaning").textContent = "";
    $("example").textContent = err.message;
    $("status").textContent = "Put this HTML file in the same folder as german_vocab.json.";
  }
}

function walk(value, level) {
  if (Array.isArray(value)) {
    for (const item of value) {
      if (item && typeof item === "object" && (item.de || item.word)) {
        allWords.push({
          level,
          de: item.de || item.word,
          en: item.en || "",
          example: item.example || item.de || item.word || ""
        });
      }
    }
    return;
  }
  if (value && typeof value === "object") {
    for (const child of Object.values(value)) walk(child, level);
  }
}

function update() {
  const item = words[index];
  $("word").textContent = item.de;
  $("meaning").textContent = item.en ? `English: ${item.en}` : "";
  $("example").textContent = item.example;
  $("progress").textContent = `${index + 1} / ${words.length} · ${item.level}`;
  $("status").textContent = "";
}

function speak(text) {
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "de-DE";
  utterance.rate = parseFloat($("speed").value);
  utterance.pitch = 1;

  // Prefer a German voice.
  const germanVoice = voices.find(v => /^de(-|_)/i.test(v.lang));
  if (germanVoice) utterance.voice = germanVoice;

  utterance.onstart = () => $("status").textContent = "🔊 Listening…";
  utterance.onend = () => {
    $("status").textContent = "Finished.";
    if (autoPlay) setTimeout(nextWord, 900);
  };
  utterance.onerror = () => $("status").textContent = "Speech could not be played.";
  speechSynthesis.speak(utterance);
}

function listen() { speak(words[index].example); }
function nextWord() {
  index = (index + 1) % words.length;
  update();
  if (autoPlay) setTimeout(listen, 250);
}
function prevWord() {
  index = (index - 1 + words.length) % words.length;
  update();
}
function shuffle() {
  for (let i = words.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [words[i], words[j]] = [words[j], words[i]];
  }
  index = 0;
  update();
}
function filterLevel() {
  const level = $("level").value;
  words = level === "ALL" ? [...allWords] : allWords.filter(x => x.level === level);
  index = 0;
  update();
}

$("listen").onclick = listen;
$("repeat").onclick = listen;
$("next").onclick = nextWord;
$("prev").onclick = prevWord;
$("shuffle").onclick = shuffle;
$("level").onchange = filterLevel;
$("speed").oninput = () => $("speedValue").textContent = $("speed").value + "×";
$("auto").onclick = () => {
  autoPlay = !autoPlay;
  $("auto").textContent = autoPlay ? "⏸ Auto-play: On" : "▶ Auto-play: Off";
  if (autoPlay) listen();
  else speechSynthesis.cancel();
};

document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); listen(); }
  if (e.code === "ArrowRight") nextWord();
  if (e.code === "ArrowLeft") prevWord();
});

loadVocabulary();
</script>
</body>
</html>
